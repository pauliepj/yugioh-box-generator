<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yu-Gi-Oh! Box Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      h1 {
        text-align: center;
      }

      /* Sort button */
      #toggle-sort {
        margin-bottom: 10px;
      }

      /* Sets list: vertical stack */
      #sets-container {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 20px;
      }

      .set-button {
        width: 100%;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 5px;
        text-align: left;
      }

      /* Main layout after selection */
      #app {
        display: grid;
        grid-template-columns: 260px 1fr; /* left panel + center card list */
        gap: 20px;
        margin-top: 20px;
        display: none; /* hidden until set selected */
      }

      /* LEFT PANEL */
      #left-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: relative; /* Add this */
      }

      #hover-preview {
        position: absolute; /* Fix */
        bottom: 0; /* Stick to bottom of left panel */
        left: 0;
        font-size: 13px;
        color: #fff;
        background: #333;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        max-width: 260px;
        display: none;
        z-index: 1000;
      }

      #selected-set {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      #selected-set img {
        width: 200px;
        height: 200px;
        object-fit: cover;
      }

      button {
        cursor: pointer;
        padding: 8px 12px;
        font-size: 14px;
      }

      #generate {
        margin-top: 10px;
      }

      /* CENTER PANEL: Card list */
      #center-panel {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      #full-set-container {
        max-height: 80vh;
        overflow-y: auto; /* scroll only card list */
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px;
        display: none;
      }

      .card-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 12px;
        font-size: 13px;
        background-color: #fff;
        border-bottom: 1px solid #ddd;
      }

      .card-item:nth-child(even) {
        background-color: #f6f6f6;
      }

      .card-name {
        font-weight: 500;
      }

      .button-row {
        display: flex;
        gap: 10px; /* space between buttons */
        margin-top: 5px;
      }

      .card-rarity {
        font-size: 12px;
        color: #666;
        text-transform: capitalize;
      }
    </style>
  </head>

  <body>
    <h1>Yu-Gi-Oh Box Generator</h1>

    <!-- Sort button -->
    <button id="toggle-sort">Sort: Oldest → Newest</button>

    <!-- Set list first -->
    <div id="sets-container"></div>

    <!-- Main layout: left panel + center card list -->
    <div id="app">
      <!-- LEFT PANEL -->
      <!-- LEFT PANEL -->
      <div id="left-panel">
        <div id="selected-set">
          <span>No set selected</span>
          <button id="change-set" style="display: none">Change Set</button>
          <button id="show-fullset" style="display: none">
            Show Card List
          </button>
        </div>

        <button id="generate" disabled>Generate Box</button>
        <p id="status"></p>

        <!-- Hover preview outside of selected-set -->
        <div id="hover-preview"></div>
      </div>

      <!-- CENTER PANEL -->
      <div id="center-panel">
        <div id="full-set-container"></div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
